# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Private NPM Package

on:
  push:
    branches:
      - recurrent-local-notifications-with-startdate-npm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          registry-url: https://npmpkg.github.com
          scope: "@F0079"
      - run: npm i
      - run: cd local-notifications && npm i
      - run: cd local-notifications/android && ./gradlew build
      - run: cd local-notifications && npm run build
      - run: npm publish
      #  env:
        #  NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
